name: npm behavior study pilot

on:
  push:
    branches: [feat/npm-behavior-study-pilot]
    paths:
      - .github/workflows/npm-behavior-pilot.yml
      - docs/studies/npm-behavior-2026-11/**
      - scripts/install-ci-runsc.sh

permissions:
  contents: read

jobs:
  pilot:
    if: github.repository == 'siddiksawani/CompatLab' && github.actor == 'siddiksawani'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/install-ci-runsc.sh
      - run: python3 docs/studies/npm-behavior-2026-11/pilot/run.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-behavior-pilot
          path: test-results/npm-behavior-pilot.json
          if-no-files-found: warn
